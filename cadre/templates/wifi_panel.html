<section id="wifi">
  <h2>Wi-Fi</h2>
  <p id="wifi-state" class="muted">{{ _("Chargement…") }}</p>
  <p id="wifi-result" class="msg"></p>

  <h3>{{ _("Réseaux enregistrés") }}</h3>
  <ul id="wifi-saved" class="list"></ul>

  <h3>{{ _("Réseaux visibles") }} <button id="wifi-scan" type="button">{{ _("Actualiser") }}</button></h3>
  <ul id="wifi-visible" class="list"></ul>

  <form id="wifi-form" class="wifi-form" autocomplete="off">
    <label>{{ _("Nom du réseau") }}
      <input type="text" name="ssid" maxlength="32" required>
    </label>
    <label>{{ _("Mot de passe") }}
      <input type="password" name="password" maxlength="63">
    </label>
    <label class="small" style="flex-direction:row;align-items:center">
      <input type="checkbox" id="wifi-show"> {{ _("afficher") }}
    </label>
    <button type="submit" name="connect" class="primary">{{ _("Se connecter") }}</button>
    <button type="submit" name="save">{{ _("Enregistrer seulement") }}</button>
  </form>
  <p class="muted small">{{ _("« Enregistrer seulement » garde le réseau pour plus tard, par exemple pour préparer le cadre avant de l'installer chez quelqu'un d'autre.") }}</p>
</section>
