<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ _("Cadre photo") }} — {{ _("Connexion") }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="login">
  <header>
    <h1>{{ _("Cadre photo") }}</h1>
    {% include "lang_select.html" %}
  </header>
  <form method="post" action="/login" class="wifi-form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ _("Utilisateur") }}
      <input type="text" name="username" value="admin" autocomplete="username" readonly>
    </label>
    <label>{{ _("Mot de passe") }}
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <button type="submit" class="primary">{{ _("Se connecter") }}</button>
  </form>
  {% if error %}<p class="msg error">{{ _(error) }}</p>{% endif %}
</main>
</body>
</html>
